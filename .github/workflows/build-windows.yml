name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: One-file executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Build executable
        run: uv run pyinstaller image_watermark_app.spec --noconfirm

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImageWatermarkApp-windows-x86_64
          path: dist/ImageWatermarkApp.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "dist/ImageWatermarkApp.exe"
          $label = "ImageWatermarkApp-$($env:GITHUB_REF_NAME)-windows-x86_64.exe"
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }
          gh release upload $env:GITHUB_REF_NAME "${asset}#${label}" --clobber
